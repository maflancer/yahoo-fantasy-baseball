[project]
name = "fantasy-pipeline"
version = "0.1.0"
description = "Pull Yahoo Fantasy league data and write JSON for the web app"
requires-python = ">=3.12"
dependencies = [
    "yahoo-fantasy-api>=2.12.3",
    "yahoo-oauth>=2.1.1",
]

[project.scripts]
fantasy-pipeline = "fantasy_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
